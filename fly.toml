# fly.toml — see https://fly.io/docs/reference/configuration/
#
# One process serves the API, the collaboration socket and the frontend, so
# there is a single internal port. Set DATABASE_URL as a secret:
#
#     fly secrets set DATABASE_URL=postgres://...

app = 'topical'
primary_region = 'sea'

[build]

[env]
  ENVIRONMENT = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Collaboration rooms and their documents live in the machine's memory, so a
  # machine that stops loses the in-progress state of anything open on it.
  # Keeping one running avoids that for the common case.
  min_machines_running = 1
  processes = ['app']

# Uploaded images are written to disk; without a volume they vanish on deploy.
[[mounts]]
  source = 'topical_uploads'
  destination = '/app/uploads'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
